<meta charset="UTF-8">

<title>《奥丁的盛宴》AI 顾问 · 数据仪表盘</title>
<style>
  :root{
    --bg:#0d1b2e; --bg2:#0a1524; --panel:#12233d; --panel2:#16294a;
    --line:#1e3a5f; --line-soft:#18304f;
    --txt:#dbe6f4; --muted:#7f93ad; --faint:#5b7089;
    --gold:#e8b33f; --gold-deep:#d4a017; --blue:#8fc1f0; --blue-deep:#6ea8e0;
    --green:#3fa97a; --red:#e06c6c; --white:#f4f8ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg2)}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
    color:var(--txt); min-height:100vh; padding:28px 24px 60px;
    background:
      radial-gradient(1200px 500px at 70% -10%, #16294a55 0%, transparent 60%),
      linear-gradient(180deg,#0d1b2e 0%, #0a1524 100%);
  }
  .wrap{max-width:1560px;margin:0 auto}

  /* ---------- 头部 ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;
    flex-wrap:wrap;gap:14px;margin-bottom:18px}
  h1{font-size:26px;font-weight:700;letter-spacing:1px}
  h1 .accent{color:var(--gold)}
  .subtitle{color:var(--muted);font-size:13px;margin-top:6px}
  .tabs{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:6px}
  .tab{border:none;background:transparent;color:var(--muted);font-size:15px;
    font-family:inherit;padding:9px 26px;border-radius:8px;cursor:pointer;
    letter-spacing:2px;transition:all .18s}
  .tab:hover{color:var(--txt)}
  .tab.active{background:var(--panel2);color:var(--gold);font-weight:700;
    box-shadow:inset 0 0 0 1px #2a4a76}

  /* ---------- 卡片 ---------- */
  .panel{background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:20px 24px 26px;
    box-shadow:0 8px 28px rgba(0,0,0,.35)}
  .corpus{font-size:12.5px;color:var(--muted);letter-spacing:.4px;
    margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px 18px}
  .corpus b{color:#a9bcd6;font-weight:600}
  .legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:12px;
    color:var(--muted);margin-bottom:14px}
  .legend .sw{display:inline-block;vertical-align:-2px;margin-right:6px}
  .legend .bar-sw{width:18px;height:9px;border-radius:2px}
  .legend .ci-sw{width:18px;height:2px;background:var(--white);position:relative}
  .legend .dash-sw{width:18px;height:0;border-top:2px dashed #c8d6ea}

  /* ---------- 表格行 ---------- */
  .rows{border-top:1px solid var(--line-soft)}
  .row,.scale-row{display:grid;
    grid-template-columns:46px 54px minmax(200px,260px) 1fr 200px;
    align-items:center;gap:14px}
  .scale-row{padding:10px 0 4px;color:var(--faint);font-size:11.5px}
  .scale-track{position:relative;height:14px}
  .scale-tick{position:absolute;top:0;transform:translateX(-50%);
    white-space:nowrap}
  .scale-tick.mid{color:#c8d6ea;font-weight:700}
  .row{padding:9px 0;border-bottom:1px solid var(--line-soft)}
  .row:hover{background:#ffffff08}
  .row.dim{opacity:.62}

  .rank{text-align:center;font-size:15px;font-weight:700;color:var(--faint);
    font-variant-numeric:tabular-nums}
  .row:nth-child(-n+4) .rank{color:var(--gold)}

  .icon{position:relative;width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;color:#0d1b2e;
    box-shadow:0 2px 8px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.14)}
  .icon .corner{position:absolute;right:-4px;bottom:-4px;min-width:19px;
    height:19px;border-radius:9px;font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
    color:#0d1b2e;border:2px solid var(--panel)}
  .g-S{background:var(--gold)} .g-A{background:var(--green);color:#fff}
  .g-B{background:var(--blue-deep);color:#fff} .g-C{background:#8a97a8;color:#fff}
  .g-na{background:#5b7089;color:#cdd8e6}

  .name-col{min-width:0}
  .name{font-size:15.5px;font-weight:600;display:flex;align-items:center;
    gap:8px;flex-wrap:wrap}
  .sub{font-size:11.5px;color:var(--faint);margin-top:3px}
  .badge{font-size:10.5px;font-weight:700;border-radius:9px;padding:2px 8px;
    letter-spacing:1px;line-height:1.5}
  .badge.sig{background:var(--gold);color:#14100a}
  .badge.low{background:#3a4a61;color:#9fb0c6;font-weight:500}
  .badge.lift-pos{background:#2c4a2f;color:#8fd9a8}
  .badge.lift-neg{background:#4a2c2c;color:#e8a0a0}

  /* ---------- 胜率条 ---------- */
  .track{position:relative;height:34px;background:#0b1727;
    border:1px solid var(--line-soft);border-radius:8px;overflow:visible}
  .gridline{position:absolute;top:0;bottom:0;width:1px;background:#1a2f4d}
  .midline{position:absolute;top:-4px;bottom:-4px;width:0;
    border-left:2px dashed #c8d6ea;opacity:.85;z-index:3}
  .bar{position:absolute;top:50%;height:14px;transform:translateY(-50%);
    border-radius:3px;z-index:1}
  .bar.pos{background:linear-gradient(90deg,#8a6a1e,var(--gold));
    box-shadow:0 0 10px #e8b33f55}
  .bar.neg{background:linear-gradient(90deg,var(--blue),#3f6ea0);
    box-shadow:0 0 10px #8fc1f044}
  .row.dim .bar{filter:saturate(.4) brightness(.75)}
  .ci{position:absolute;top:50%;height:2px;background:var(--white);
    transform:translateY(-50%);z-index:4;opacity:.95}
  .ci::before,.ci::after{content:"";position:absolute;top:-4px;width:2px;
    height:10px;background:var(--white)}
  .ci::before{left:0} .ci::after{right:0}
  .dot{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;
    background:var(--white);transform:translate(-50%,-50%);z-index:5;
    box-shadow:0 0 5px rgba(0,0,0,.6)}

  /* ---------- 右列数值 ---------- */
  .val{text-align:right}
  .pct{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;
    letter-spacing:.5px}
  .pct.pos{color:var(--gold)} .pct.neg{color:var(--blue)}
  .val .n{font-size:12.5px;color:#a9bcd6;font-weight:600;margin-top:2px;
    font-variant-numeric:tabular-nums}

  /* ---------- tooltip ---------- */
  #tip{position:fixed;z-index:99;max-width:440px;background:#0a1424f2;
    border:1px solid #2a4a76;border-radius:10px;padding:12px 14px;
    font-size:12.5px;line-height:1.7;color:var(--txt);pointer-events:none;
    display:none;box-shadow:0 10px 30px rgba(0,0,0,.6)}
  #tip .t-head{font-weight:700;font-size:13.5px;color:var(--gold);
    margin-bottom:4px}
  #tip .t-meta{color:var(--muted);font-size:11.5px;margin-bottom:6px}
  #tip .t-gist{color:#c4d4ea}
  #tip .t-img{display:flex;gap:8px;justify-content:center;align-items:flex-start;
    margin:2px 0 8px}
  #tip .t-img .img-frame{background-color:#0b1727;border:1px solid var(--line-soft);
    border-radius:6px;overflow:hidden;flex:none;background-repeat:no-repeat}
  #tip .t-img img{display:block}

  footer{margin-top:16px;color:var(--faint);font-size:11.5px;text-align:center;
    letter-spacing:.5px}
  .view{display:none}.view.active{display:block}

  /* ---------- 视图口径说明 / 分组标题 ---------- */
  .viewnote{font-size:12px;color:var(--faint);letter-spacing:.3px;
    margin:-2px 0 10px}
  .viewnote b{color:#a9bcd6;font-weight:600}
  .cardfilter{display:flex;align-items:center;gap:10px;font-size:13px;
    color:var(--dim);margin-bottom:10px;padding:7px 12px;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
    border-radius:8px}
  .cardfilter input[type=range]{flex:0 0 220px;accent-color:var(--gold)}
  .cardfilter b{color:var(--gold);min-width:26px;text-align:right}
  .cardfilter .cf-quick{display:flex;gap:6px}
  .cardfilter .cf-quick button{background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);color:var(--dim);
    border-radius:5px;padding:2px 8px;font-size:12px;cursor:pointer}
  .cardfilter .cf-quick button:hover{color:var(--gold);border-color:var(--gold)}
  .cardfilter .cf-count{margin-left:auto;color:var(--faint)}
  .group-title{font-size:14.5px;font-weight:700;color:var(--gold);
    letter-spacing:1px;margin:18px 0 8px;padding-left:10px;
    border-left:3px solid var(--gold-deep)}
  .group-title:first-child{margin-top:4px}
  .group-title .g-sub{font-size:11.5px;color:var(--faint);font-weight:400;
    margin-left:10px;letter-spacing:.3px}
  .group-foot{font-size:12px;color:var(--faint);letter-spacing:.3px;
    margin:8px 0 4px;padding-left:10px}
  .group-foot b{color:#a9bcd6;font-weight:600}

  /* 多字图标（组合/分桶） */
  .icon.small{font-size:12px;letter-spacing:0}

  /* ---------- 骰子视图：胜者 vs 败者双条 ---------- */
  .dbar{position:absolute;left:0;height:9px;border-radius:3px;z-index:1}
  .dbar.win{top:5px;background:linear-gradient(90deg,#8a6a1e,var(--gold));
    box-shadow:0 0 8px #e8b33f55}
  .dbar.lose{bottom:5px;background:linear-gradient(90deg,#3f6ea0,var(--blue));
    box-shadow:0 0 8px #8fc1f044}
  .dlab{position:absolute;font-size:10.5px;font-weight:700;
    font-variant-numeric:tabular-nums;white-space:nowrap;z-index:2}
  .dlab.win{top:2px;color:var(--gold)}
  .dlab.lose{bottom:2px;color:var(--blue)}
  .val .cmp{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
    line-height:1.45}
  .val .cmp .w{color:var(--gold)} .val .cmp .l{color:var(--blue)}
</style>
</head>

    </div>

  <section class="panel">
    <div class="corpus" id="corpus"></div>
    <div class="viewnote" id="viewnote"></div>
    <div class="cardfilter" id="cardfilter" style="display:none">
      <label>出场次数 ≥ </label>
      <input type="range" id="cardmin" min="1" max="150" value="10" step="1">
      <b id="cardminval">10</b>
      <span class="cf-quick">
        <button data-v="10">≥10</button><button data-v="30">≥30</button>
        <button data-v="50">≥50</button><button data-v="100">≥100</button>
      </span>
      <span class="cf-count">显示 <b id="cardcnt"></b> 张</span>
    </div>
    <div class="legend">
      <span><span class="sw bar-sw" style="background:var(--gold)"></span>正侧（胜率 &gt; 50%）</span>
      <span><span class="sw bar-sw" style="background:var(--blue)"></span>负侧（胜率 &lt; 50%）</span>
      <span><span class="sw ci-sw"></span>Wilson 95% CI 须线</span>
      <span><span class="sw dash-sw"></span>50% 基准线</span>
      <span><span class="badge sig" style="vertical-align:1px">显著</span> CI 不含 50%</span>
      <span><span class="badge low" style="vertical-align:1px">数据不足</span> n &lt; 10</span>
    </div>
    <div class="scale-row">
      <div></div><div></div><div></div>
      <div class="scale-track" id="scale"></div>
      <div style="text-align:right" id="scale-label">胜率 · n / 总样本</div>
    </div>
    <div class="rows" id="rows"></div>
  </section>

  <footer>Odin Advisor · 语料快照 corpus_1460_snapshot.json（最终版 1460 局 mini2 长局） · 由 tools/make_dashboard.py 生成 · 相关非因果，不构成出牌建议的唯一依据</footer>
</div>

const GRADE_CLASS = {"S":"g-S","A":"g-A","B":"g-B","C":"g-C","数据不足":"g-na"};
const ICON_BG = ["#c98f3d","#4f86c6","#5f9e8f","#9a6fb0","#b0705f","#6f8fc0",
                 "#a8934f","#5fa0b0","#b06f8f","#7a9e5f"];

/* 每个视图自适应横轴：覆盖所有 CI 端点，向 5% 取整，至少含 50% */
function domainOf(items){
  let lo = 50, hi = 50;
  for(const it of items){ if(it.n>0){ lo=Math.min(lo,it.lo); hi=Math.max(hi,it.hi);} }
  lo = Math.max(0, Math.floor((lo-1.5)/5)*5);
  hi = Math.min(100, Math.ceil((hi+1.5)/5)*5);
  if(hi-lo < 20){ const m=(hi+lo)/2; lo=Math.max(0,m-10); hi=Math.min(100,m+10); }
  return [lo,hi];
}
const X = (v,d)=>((v-d[0])/(d[1]-d[0])*100);
function ticksOf(d){
  const t=[];
  for(let v=Math.ceil(d[0]/10)*10; v<=d[1]; v+=10) t.push(v);
  if(d[0]<=50 && 50<=d[1] && !t.includes(50)) t.push(50);
  return [...new Set(t)].sort((a,b)=>a-b);
}

function sigOf(it){ return it.n>=10 && (it.lo>50 || it.hi<50); }

/* 每个视图顶部的口径说明（全部视图共用 1460 局 / Wilson CI / 相关非因果口径） */
function viewNote(view){
  const base = `口径：<b>${META.games}</b> 局 / <b>${META.samples}</b> 玩家样本 · `;
  const tail = ` · <b>相关非因果</b>`;
  switch(view){
    case "islands": return base + `样本 = 本局拿过该岛的玩家 · 角标 = S/A/B/C 分级` + tail;
    case "pairs": return base + `共现 <b>n≥30</b> 的岛对按组合胜率降序 · <b>组合 lift = 组合胜率 − 两岛单拿（边缘）胜率均值</b> · 悬停行查看单拿胜率明细` + tail;
    case "sheds": return base + `R1-4 建造口径（R5+ 建造不计入）` + tail;
    case "cards": return base + `出场次数 ≥ <b>${cardMinN}</b>（上方滑块可调）· 悬停行查看卡号/分值/效果摘要` + tail;
    case "dice": return base + `胜者 vs 败者对比（胜 <b>${META.dice_win}</b> 人 / 负 <b>${META.dice_lose}</b> 人，平局 ${META.dice_tie} 人未计入）· 条形 = <b>掷骰成功率</b>（<span style="color:var(--gold)">金=胜组</span> / <span style="color:var(--blue)">蓝=负组</span>）· 小字 = 使用率与人均次数` + tail;
    case "emigration": {
      const e = DATA.emigration;
      return base + `赢家画像：胜者 vs 败者对比（胜 <b>${e.n_win}</b> 人 / 负 <b>${e.n_lose}</b> 人，平局未计入）· 条形 = <b>占本组比例</b>（<span style="color:var(--gold)">金=胜组</span> / <span style="color:var(--blue)">蓝=负组</span>）· 移民判定 = 纯银币支付且金额 = 轮数（大移民 = 同一行动内打出职业卡；减费卡 R4+ 认 金额=轮数−1）` + tail;
    }
    case "crown": {
      const c = DATA.crown;
      return base + `皇冠判定 = gain_items / exchange 拿取「大不列颠皇冠 / 英格兰王冠」（皇冠全局仅一块，主要经 d12 大打劫获得）· <b>${c.games_pct}%</b> 的局有人拿到皇冠（${c.holders} 局）· 持有者：胜 <b>${c.win_pct}%</b> / 负 ${c.lose_pct}% / 平 ${c.tie_pct}% · 无人拿到的局无影响不计入` + tail;
    }
    case "duel": {
      const u = DATA.duel.meta;
      return base + `对立局分析：熊岛 vs 火地岛（${u.bear_island_n} 局，平均拿取轮 R${u.bear_island_r} / R${u.tierra_del_fuego_r}）· 罗弗敦群岛 vs 马尔岛（${u.lofoten_n} 局，R${u.lofoten_r} / R${u.isle_of_mull_r}）· 各组含「第三岛归谁的影响」（拿岛方胜率，n≥10）` + tail;
    }
  }
  return "";
}

function renderScale(d){
  scaleEl.innerHTML = ticksOf(d).map(v=>{
    const cls = v===50 ? "scale-tick mid" : "scale-tick";
    return `<span class="${cls}" style="left:${X(v,d)}%">${v}%</span>`;
  }).join("");
}

function gridHtml(d){
  let h = ticksOf(d).filter(v=>v!==50)
    .map(v=>`<div class="gridline" style="left:${X(v,d)}%"></div>`).join("");
  if(d[0]<=50 && 50<=d[1])
    h += `<div class="midline" style="left:${X(50,d)}%"></div>`;
  return h;
}

function barHtml(it,d){
  if(it.n===0) return `<span style="color:var(--faint);font-size:12px">无样本</span>`;
  const x50=X(50,d), xw=X(it.wr,d);
  const left=Math.min(x50,xw), width=Math.abs(xw-x50);
  const side = it.wr>=50 ? "pos":"neg";
  const clo=X(it.lo,d), chi=X(it.hi,d);
  return gridHtml(d)
    + `<div class="bar ${side}" style="left:${left}%;width:${Math.max(width,0.4)}%"></div>`
    + `<div class="ci" style="left:${clo}%;width:${Math.max(chi-clo,0.6)}%"></div>`
    + `<div class="dot" style="left:${xw}%"></div>`;
}

function valHtml(it, extra){
  if(it.n===0) return `<div class="val"><div class="pct" style="color:var(--faint)">—</div>`
    + `<div class="n">n=0 / ${META.samples}</div></div>`;
  const side = it.wr>=50 ? "pos":"neg";
  return `<div class="val"><div class="pct ${side}">${it.wr.toFixed(1)}%</div>`
    + `<div class="n">n=${it.n} / ${META.samples}${extra||""}</div></div>`;
}

function badges(it){
  let b="";
  if(it.n<10) b+=`<span class="badge low">数据不足</span>`;
  else if(sigOf(it)) b+=`<span class="badge sig">显著</span>`;
  return b;
}

    if(view==="pairs"){
      const lp = it.pair_lift>=0;
      sub=`<span class="badge ${lp?"lift-pos":"lift-neg"}">组合 lift ${lp?"+":""}${it.pair_lift.toFixed(1)}pp</span>`
        + ` 共现 ${it.n} 次`;
    }
    if(view==="cards"){
      const lp = it.lift>=0;
      sub=`<span class="badge ${lp?"lift-pos":"lift-neg"}">lift ${lp?"+":""}${it.lift.toFixed(1)}pp</span>`
        + ` 出场 ${it.n} 次 · 场均 ${it.avg} 分`;
    }
    const tipAttr = view==="cards" ? ` data-card="${it._idx}"`
                  : view==="pairs" ? ` data-pair="${i}"`
                  : view==="islands" ? ` data-isl="${i}"`
                  : view==="sheds" ? ` data-shed="${i}"` : "";
    html += `<div class="row${dim}"${tipAttr}>
      <div class="rank">${i+1}</div>
      <div class="icon${small}" style="background:${iconBg}">${iconTxt}${corner}</div>
      <div class="name-col"><div class="name">${it.zh}${badges(it)}</div>
        <div class="sub">${sub}</div></div>
      <div class="track">${barHtml(it,d)}</div>
      ${valHtml(it)}
    </div>`;
  });
  rowsEl.innerHTML = html;
  if(view==="cards") bindCardTips();
  if(view==="pairs") bindPairTips();
  if(view==="islands") bindIslTips();
  if(view==="sheds") bindShedTips();
}

/* ---------- 分桶组视图（皇冠） ---------- */
function renderGroups(view){
  const groups = DATA[view].groups;
  const all = groups.flatMap(g=>g.items);
  const d = domainOf(all);
  renderScale(d);
  let html="";
  groups.forEach(g=>{
    html += `<div class="group-title">${g.title}</div>`;
    g.items.forEach((it,i)=>{
      const dim = it.n<10 ? " dim":"";
      const small = (it.icon||"").length>1 ? " small" : "";
      const lp = it.lift>=0;
      const sub = it.n===0 ? "无样本"
        : `<span class="badge ${lp?"lift-pos":"lift-neg"}">lift ${lp?"+":""}${it.lift.toFixed(1)}pp</span>`
        + ` n=${it.n} · 场均 ${it.avg} 分`;
      html += `<div class="row${dim}">
        <div class="rank">${i+1}</div>
        <div class="icon${small}" style="background:${ICON_BG[(i+2)%ICON_BG.length]}">${it.icon}</div>
        <div class="name-col"><div class="name">${it.label}${badges(it)}</div>
          <div class="sub">${sub}</div></div>
        <div class="track">${barHtml(it,d)}</div>
        ${valHtml(it)}
      </div>`;
    });
  });
  rowsEl.innerHTML = html;
}

/* ---------- 骰子行动：胜者 vs 败者对比 ---------- */
function renderDice(){
  const items = DATA.dice;
  const rates = [];
  items.forEach(it=>{ for(const g of ["win","lose"]){
    const s = it.groups[g].succ; if(s!=null) rates.push(s); }});
  let lo = Math.min(...rates), hi = Math.max(...rates);
  lo = Math.max(0, Math.floor((lo-2)/5)*5);
  hi = Math.min(100, Math.ceil((hi+2)/5)*5);
  const d = [lo,hi];
  renderScale(d);
  let html="";
  items.forEach((it,i)=>{
    const w = it.groups.win, l = it.groups.lose;
    let bars = gridHtml(d);
    for(const [g,gr] of [["win",w],["lose",l]]){
      if(gr.succ==null){
        bars += `<span class="dlab ${g}" style="left:2px">${g==="win"?"胜":"负"} —（n=${gr.acts} 次出手）</span>`;
        continue;
      }
      const xw = X(gr.succ,d);
      bars += `<div class="dbar ${g}" style="width:${xw}%"></div>`
            + `<span class="dlab ${g}" style="left:calc(${xw}% + 5px)">${g==="win"?"胜":"负"} ${gr.succ.toFixed(1)}%</span>`;
    }
    const val = `<div class="val"><div class="cmp"><span class="w">胜 ${w.succ==null?"—":w.succ.toFixed(1)+"%"}</span><br><span class="l">负 ${l.succ==null?"—":l.succ.toFixed(1)+"%"}</span></div>`
      + `<div class="n">成功率</div></div>`;
    const sub = `使用率 <span style="color:var(--gold)">胜 ${w.use}%</span> / <span style="color:var(--blue)">负 ${l.use}%</span>`
      + ` · 人均 <span style="color:var(--gold)">胜 ${w.avg}</span> / <span style="color:var(--blue)">负 ${l.avg}</span> 次`;
    html += `<div class="row" data-dice="${i}">
      <div class="rank">${i+1}</div>
      <div class="icon" style="background:${ICON_BG[i%ICON_BG.length]}">${it.icon}</div>
      <div class="name-col"><div class="name">${it.zh}</div>
        <div class="sub">${sub}</div></div>
      <div class="track">${bars}</div>
      ${val}
    </div>`;
  });
  rowsEl.innerHTML = html;
  bindDiceTips();
}

/* ---------- 移民：赢家画像（胜者 vs 败者双条，样式同骰子行动） ---------- */
function renderEmigration(){
  const groups = DATA.emigration.groups;
  const rates = [];
  groups.forEach(g=>g.items.forEach(it=>{ rates.push(it.win, it.lose); }));
  let lo = Math.min(...rates), hi = Math.max(...rates);
  lo = Math.max(0, Math.floor((lo-2)/5)*5);
  hi = Math.min(100, Math.ceil((hi+2)/5)*5);
  const d = [lo,hi];
  renderScale(d);
  let html="";
  groups.forEach(g=>{
    html += `<div class="group-title">${g.title}<span class="g-sub">占本组（胜 / 负）比例</span></div>`;
    g.items.forEach((it,i)=>{
      const small = (it.icon||"").length>1 ? " small" : "";
      let bars = gridHtml(d);
      for(const [gr,v] of [["win",it.win],["lose",it.lose]]){
        const xw = X(v,d);
        bars += `<div class="dbar ${gr}" style="width:${xw}%"></div>`
              + `<span class="dlab ${gr}" style="left:calc(${xw}% + 5px)">${gr==="win"?"胜":"负"} ${v.toFixed(1)}%</span>`;
      }
      const val = `<div class="val"><div class="cmp"><span class="w">胜 ${it.win.toFixed(1)}%</span><br><span class="l">负 ${it.lose.toFixed(1)}%</span></div>`
        + `<div class="n">占本组比例</div></div>`;
      html += `<div class="row">
        <div class="rank">${i+1}</div>
        <div class="icon${small}" style="background:${ICON_BG[(i+2)%ICON_BG.length]}">${it.icon}</div>
        <div class="name-col"><div class="name">${it.label}</div></div>
        <div class="track">${bars}</div>
        ${val}
      </div>`;
    });
    if(g.foots && g.foots.length){
      const parts = g.foots.map(f=>`${f.label} <b><span style="color:var(--gold)">胜 ${f.win.toFixed(2)}</span> / <span style="color:var(--blue)">负 ${f.lose.toFixed(2)}</span></b> ${f.unit}`);
      html += `<div class="group-foot">${parts.join(" · ")}</div>`;
    }
  });
  rowsEl.innerHTML = html;
}

function render(view){
  noteEl.innerHTML = viewNote(view);
  document.getElementById("cardfilter").style.display = view==="cards" ? "" : "none";
  if(view==="cards"){
    document.getElementById("cardcnt").textContent =
      DATA.cards.filter(it=>it.n>=cardMinN).length + " / " + DATA.cards.length;
  }
  scaleLabel.textContent = view==="dice" ? "掷骰成功率"
    : view==="emigration" ? "占本组比例（胜 / 负）" : "胜率 · n / 总样本";
  if(view==="dice") return renderDice();
  if(view==="emigration") return renderEmigration();
  if(view==="crown") return renderGroups(view);
  if(view==="duel") return renderGroups(view);
  return renderRank(view);
}

/* ---------- tooltip 共用定位 ---------- */
function followTip(rowEl){
  rowEl.addEventListener("mousemove",e=>{
    const w=tip.offsetWidth,h=tip.offsetHeight;
    let x=e.clientX+18,y=e.clientY+14;
    if(x+w>innerWidth-12) x=e.clientX-w-14;
    if(y+h>innerHeight-12) y=Math.max(8,innerHeight-h-12);
    tip.style.left=x+"px"; tip.style.top=y+"px";
  });
  rowEl.addEventListener("mouseleave",()=>{ tip.style.display="none"; });
}

/* ---------- 悬停实图（DATA.images：id → 图像规格，缺映射则降级为纯文字） ----------
   三种模式：
   img — 直接 <img>（自托管扫图，相对路径）
   pct — 雪碧图，background-size/position 用百分比（BGA 原生写法，元素整体缩放）
   px  — 雪碧图，background-position 用固定像素（可选 background-size 缩放宽度） */
function imgHtml(id){
  const s = (DATA.images||{})[id];
  if(!s) return "";
  if(s.mode==="img"){
    return `<div class="img-frame"><img src="${s.src}"`
      + ` style="width:${s.size[0]}px;height:${s.size[1]}px" alt="" loading="lazy"></div>`;
  }
  if(s.mode==="pct"){
    return `<div class="img-frame" style="width:${s.size[0]}px;height:${s.size[1]}px;`
      + `background-image:url('${s.src}');`
      + `background-size:${s.bgsize[0]}% ${s.bgsize[1]}%;`
      + `background-position:${s.bgpos[0]}% ${s.bgpos[1]}%"></div>`;
  }
  if(s.mode==="px"){
    const bs = s.sheetw ? `background-size:${s.sheetw}px auto;` : "";
    return `<div class="img-frame" style="width:${s.size[0]}px;height:${s.size[1]}px;`
      + `background-image:url('${s.src}');${bs}`
      + `background-position:-${s.pos[0]}px -${s.pos[1]}px"></div>`;
  }
  return "";
}
function imgBlock(ids){
  const parts = (ids||[]).map(imgHtml).filter(Boolean);
  return parts.length ? `<div class="t-img">${parts.join("")}</div>` : "";
}

/* ---------- 职业卡 tooltip ---------- */
function bindCardTips(){
  rowsEl.querySelectorAll(".row[data-card]").forEach(rowEl=>{
    const it = DATA.cards[+rowEl.dataset.card];
    rowEl.addEventListener("mouseenter",()=>{
      const meta = it.unmapped ? "未映射卡号 · 按原名聚合"
        : `卡号 ${it.no} · 分值 ${it.pts ?? "?"}${it.type?` · ${it.type}`:""}`;
      tip.innerHTML = `<div class="t-head">${it.no?it.no+" · ":""}${it.zh}</div>`
        + `<div class="t-meta">${meta} · n=${it.n} · 胜率 ${it.wr.toFixed(1)}% `
        + `CI [${it.lo.toFixed(1)}, ${it.hi.toFixed(1)}] · lift ${it.lift>=0?"+":""}${it.lift.toFixed(1)}pp</div>`
        + `<div class="t-gist">${it.gist||"（无效果摘要）"}</div>`;
      tip.style.display="block";
    });
    followTip(rowEl);
  });
}

/* ---------- 岛屿组合 tooltip ---------- */
function bindPairTips(){
  rowsEl.querySelectorAll(".row[data-pair]").forEach(rowEl=>{
    const it = DATA.pairs[+rowEl.dataset.pair];
    rowEl.addEventListener("mouseenter",()=>{
      const lp = it.pair_lift>=0;
      tip.innerHTML = `<div class="t-head">${it.zh}</div>`
        + imgBlock([it.a, it.b])
        + `<div class="t-meta">共现 n=${it.n} · 组合胜率 ${it.wr.toFixed(1)}% `
        + `CI [${it.lo.toFixed(1)}, ${it.hi.toFixed(1)}]</div>`
        + `<div class="t-gist">单拿胜率：${it.zh.split(" + ")[0]} ${it.wr_a.toFixed(1)}% (n=${it.n_a})`
        + ` · ${it.zh.split(" + ")[1]} ${it.wr_b.toFixed(1)}% (n=${it.n_b})<br>`
        + `两者边缘均值 ${it.mean.toFixed(1)}% · 组合 lift <b style="color:${lp?"#8fd9a8":"#e8a0a0"}">${lp?"+":""}${it.pair_lift.toFixed(1)}pp</b>`
        + `（正 = 协同迹象，负 = 相克迹象；相关非因果）</div>`;
      tip.style.display="block";
    });
    followTip(rowEl);
  });
}

/* ---------- 岛屿 tooltip ---------- */
function bindIslTips(){

        + `<div class="t-meta">出场 n=${it.n} · 胜率 ${it.wr.toFixed(1)}% `
        + `CI [${it.lo.toFixed(1)}, ${it.hi.toFixed(1)}] · lift ${it.lift>=0?"+":""}${it.lift.toFixed(1)}pp · 场均 ${it.avg} 分 · 分级 ${it.grade}</div>`;
      tip.style.display="block";
    });
    followTip(rowEl);
  });
}

/* ---------- 手工工棚 tooltip ---------- */
function bindShedTips(){
  rowsEl.querySelectorAll(".row[data-shed]").forEach(rowEl=>{
    const it = DATA.sheds[+rowEl.dataset.shed];
    rowEl.addEventListener("mouseenter",()=>{
      tip.innerHTML = `<div class="t-head">${it.zh}</div>`
        + imgBlock([it.id])
        + `<div class="t-meta">R1-4 建造 n=${it.n} · 胜率 ${it.wr.toFixed(1)}% `
        + `CI [${it.lo.toFixed(1)}, ${it.hi.toFixed(1)}] · lift ${it.lift>=0?"+":""}${it.lift.toFixed(1)}pp · 场均 ${it.avg} 分</div>`;
      tip.style.display="block";
    });

/* ---------- 骰子工位 tooltip ---------- */
function bindDiceTips(){
  rowsEl.querySelectorAll(".row[data-dice]").forEach(rowEl=>{
    const it = DATA.dice[+rowEl.dataset.dice];
    rowEl.addEventListener("mouseenter",()=>{
      const w=it.groups.win,l=it.groups.lose;
      const fmt=g=>g.succ==null?"—":g.succ.toFixed(1)+"%";
      tip.innerHTML = `<div class="t-head">${it.zh}</div>`
        + imgBlock(["dice:"+it.kind])
        + `<div class="t-meta">掷骰成功率：<span style="color:var(--gold)">胜组 ${fmt(w)}</span>`
        + ` / <span style="color:var(--blue)">负组 ${fmt(l)}</span>`
        + ` · 使用率 胜 ${w.use}% / 负 ${l.use}% · 人均 胜 ${w.avg} / 负 ${l.avg} 次</div>`;
      tip.style.display="block";
    });
    followTip(rowEl);
  });
}

/* ---------- 职业卡出场次数筛选 ---------- */
DATA.cards.forEach((it,i)=>{ it._idx = i; });

cardSlider.addEventListener("input",()=>{

document.querySelectorAll(".tab").forEach(btn=>{

    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

render("islands");
